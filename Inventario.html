<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inventario de piezas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content">
        <h2>Inventario actual de piezas</h2>
        <a name="inventario"></a>
        <p>Aquí se muestra el inventario actual de las piezas disponibles.</p>
        <div class="table-wrap">
            <table>
                <tr>
                    <th>Código</th>
                    <th>Pieza</th>
                    <th>Disponibles</th>
                    <th>Estatus</th>
                </tr>
                <tr>
                    <td>001</td>
                    <td>Marcha</td>
                    <td>10</td>
                    <td><span class="badge">Disponible</span></td>
                </tr>
                <tr>
                    <td>002</td>
                    <td>Foco H13</td>
                    <td>1</td>
                    <td><span class="badge">Disponible</span></td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
