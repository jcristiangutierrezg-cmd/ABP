<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar clave de acceso</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content">
        <h2>Cambiar clave de acceso</h2>
        <form>
            <label for="clave_actual">Clave actual</label>
            <input type="password" id="clave_actual" name="clave_actual">

            <label for="nueva_clave">Nueva clave</label>
            <input type="password" id="nueva_clave" name="nueva_clave">

            <label for="confirmar_nueva_clave">Confirmar nueva clave</label>
            <input type="password" id="confirmar_nueva_clave" name="confirmar_nueva_clave">

            <input type="submit" value="Cambiar clave">
        </form>
    </div>
</body>

</html>
